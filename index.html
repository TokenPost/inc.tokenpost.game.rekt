/* ================= BACKGROUND PROPS =================
   Scenery the player can turn on the boss. Deliberately dealing zero damage: this is
   the humiliation axis, kept separate from the balance the fight length depends on.
   One tap arms a prop and it runs by itself for a few seconds — in a 45 second fight
   taps are a scarce resource, so anything that needs repeated tapping to stay useful
   would just be a damage loss and nobody would touch it. */

/* Props share three behaviours: they clear the aimed weapon out of the way on hover,
   they never take a tap meant for the boss, and they land with a full-screen beat so
   the effect actually registers. */
function makeProp(cls, inner) {
  const p = el('div', 'prop ' + cls, inner || '')
  const show = () => $('#aim').classList.remove('away')
  p.addEventListener('pointerenter', () => $('#aim').classList.add('away'))
  p.addEventListener('pointerleave', show)
  p.addEventListener('pointercancel', show)
  // props delete themselves while the cursor is still on them, so pointerleave
  // never arrives and the weapon would stay faded out forever
  const gone = p.remove.bind(p)
  p.remove = () => { show(); gone() }
  return p
}
function tintFlash(color) {
  const t = $('#tint'); if (!t) return
  t.style.background = `radial-gradient(60% 50% at 50% 45%, ${color}, transparent 75%)`
  t.classList.remove('on'); void t.offsetWidth; t.classList.add('on')
}
/* the dramatic beat: wash, shake, freeze-frame, shout, and he yells about it */
function propHit(label, color, opts) {
  const o = opts || {}
  $('#aim').classList.remove('away')
  tintFlash(color)
  banner(label, o.text || color)
  shake(o.shake || 'l')
  if (o.stop) G.hitstop = Math.max(G.hitstop, o.stop)
  if (!G.over && G.boss) {
    Sound.play('scream', clamp(G.boss.voice / (o.pitch || 200), .5, 1.9))
    if (o.say) bubble(o.say)
  }
}

let propTimer = 0
function clearProps() {
  clearTimeout(propTimer); propTimer = 0
  const p = $('#props'); if (p) p.innerHTML = ''
  G.downline = []

function scheduleProp() {
  clearTimeout(propTimer)

/* Grocery props sit on the shelves rather than drifting. Tap one and it flings a
   grocery at the boss: no damage, just a mess that sticks to him and then the floor. */
function flingAt(fromX, fromY, cls, color) {
  const f = el('div', 'fling ' + cls)
  f.style.left = fromX + 'px'; f.style.top = fromY + 'px'
  const tx = bossCX() + rnd(-30, 30), ty = bossCY() + rnd(-40, 40)
  f.style.setProperty('--fx', (tx - fromX).toFixed(0) + 'px')
  f.style.setProperty('--fy', (ty - fromY).toFixed(0) + 'px')
  f.style.setProperty('--ft', '.45s')
  $('#fx').appendChild(f)
  setTimeout(() => {
    f.remove()
    if (G.over || !bossEl) return
    spark(tx, ty, cls === 'egg' ? '🥚' : '🥒')
    Sound.play('splat')
    bits(tx, ty, 12, color)
    propHit(cls === 'egg' ? 'SPLAT!' : 'PICKLED!', cls === 'egg' ? '#f6e6a8cc' : '#7fb765cc',
      { text: cls === 'egg' ? '#ffe066' : '#9fe08a', shake: 'm', stop: .05, say: cls === 'egg' ? 'MY SUIT!' : 'Ugh.' })
    smearOn(tx, ty, color)
  }, 450)
}
function smearOn(ax, ay, color) {
  const lx = ax - (bossCX() - 100), ly = ay - (bossCY() - BODY_H / 2)
  const m = el('i', 'smear')
  const w = rnd(30, 52)
  m.style.setProperty('--sc', color)
  m.style.width = w.toFixed(0) + 'px'
  m.style.height = (w * .72).toFixed(0) + 'px'
  m.style.left = clamp(lx / 200 * 100, 10, 84) + '%'
  m.style.top = clamp(ly / BODY_H * 100, 8, 62) + '%'
  bossEl.querySelector('.marks').appendChild(m)
  setTimeout(() => m.classList.add('drip'), 450)
  setTimeout(() => {
    m.remove()
    const p = el('div', 'puddle')
    const pw = rnd(40, 70)
    p.style.width = pw.toFixed(0) + 'px'
    p.style.background = color
    p.style.left = (clamp(bossCX() + rnd(-40, 40), 30, AR.w - 30) - pw / 2).toFixed(0) + 'px'
    p.style.top = (AR.ground + rnd(0, 20)).toFixed(0) + 'px'
    $('#mess').appendChild(p)
    const all = $('#mess').querySelectorAll('.puddle')
    for (let i = 0; i < all.length - 8; i++) all[i].remove()
  }, 2700)
}
function spawnProp() {
  if (G.over || !theme.props || !theme.props.length) return
  if ($('#props').children.length >= 2) return       // never crowd the sky
  const kind = pick(theme.props)
  if (kind === 'eggbox' || kind === 'picklejar') return spawnShelfProp(kind)
  if (kind === 'screen') return spawnScreen()
  if (kind === 'flour') return spawnFlour()
  if (kind === 'pan') return spawnPan()
  if (kind === 'peel') return spawnPeel()
  if (kind === 'cart') return spawnCart()
  if (kind !== 'raincloud') return
  const p = makeProp('raincloud')
  const w = 96, dist = AR.w + w + 40
  p.style.left = (-w - 20) + 'px'
  p.style.top = rnd(AR.h * .10, AR.h * .30).toFixed(0) + 'px'
  p.style.setProperty('--dur', rnd(17, 26).toFixed(1) + 's')
  p.style.setProperty('--dist', dist.toFixed(0) + 'px')
  p.style.setProperty('--shift', '0px')
  p.addEventListener('pointerdown', e => { e.stopPropagation(); burstRain(p) })
  p.addEventListener('animationend', () => p.remove())
  $('#props').appendChild(p)
}

/* Open the fridge and a blast of cold hits whatever is in front of it. No damage —
   he just goes pale and stiff for a few seconds, which is funnier than a number. */
function placeFridge() {
  const H = 122
  const p = makeProp('p-fridge',
    artEl('fridgeBox', { h: H }) + '<div class="glowbox"></div>' +
    `<span class="fr-door">${artEl('fridgeDoor', { h: H })}</span>`)
  const x = 18
  p.style.left = x + 'px'
  p.style.top = (AR.ground - H) + 'px'
  p.style.animation = 'none'
  let ready = true
  p.addEventListener('pointerdown', e => {
    e.stopPropagation()
    if (!ready) return
    ready = false
    p.classList.add('open')
    Sound.play('shield', 1.4)
    // cold rolls out of the doorway, then frost settles
    for (let i = 0; i < 10; i++) {
      const c = el('i', 'chill')
      c.style.left = (x + 70) + 'px'
      c.style.top = (AR.ground - 20 - rnd(10, 100)).toFixed(0) + 'px'
      c.style.width = rnd(30, 70).toFixed(0) + 'px'
      c.style.setProperty('--cw', rnd(120, 260).toFixed(0) + 'px')
      c.style.animationDelay = (i * 55) + 'ms'
      $('#props').appendChild(c)
      setTimeout(() => c.remove(), 1300 + i * 55)
    }
    for (let i = 0; i < 16; i++) {
      const f = el('i', 'frost')
      f.style.left = (x + 60 + rnd(-10, 150)).toFixed(0) + 'px'
      f.style.top = (AR.ground - rnd(50, 130)).toFixed(0) + 'px'
      f.style.setProperty('--ff', rnd(60, 130).toFixed(0) + 'px')
      f.style.animationDelay = (i * 45) + 'ms'
      $('#props').appendChild(f)
      setTimeout(() => f.remove(), 1300 + i * 45)
    }
    setTimeout(() => p.classList.remove('open'), 1500)
    p.classList.add('cooling')
    setTimeout(() => { p.classList.remove('cooling'); ready = true }, 7000)
    if (Math.abs(bossCX() - (x + 40)) < 250) {
      bossEl.classList.add('frozen')
      propHit('FROZEN!', '#9fdcffdd', { text: '#bfe6ff', shake: 'l', stop: .1, pitch: 150, say: 'S-so cold...' })
      flash()
      for (const j of skel) j.k = j.base * 3.2            // stiff as a board
      setTimeout(() => {
        if (!bossEl) return
        bossEl.classList.remove('frozen')
        if (!G.over) restorePose()
      }, 3200)
    }
  })
  $('#props').appendChild(p)
}
/* Shove the cart and it rolls into him. Pure knockback, no damage. */
function spawnCart() {
  const p = makeProp('p-cart', artEl('cart', { h: 86 }))
  const fromLeft = false                       // the fridge owns the left wall
  const x = AR.w - rnd(132, 170)          // the gap between him and the checkout
  p.style.left = x.toFixed(0) + 'px'
  p.style.top = (AR.ground - 78).toFixed(0) + 'px'
  p.style.animation = 'none'
  if (!fromLeft) p.style.transform = 'scaleX(-1)'
  let used = false
  p.addEventListener('pointerdown', e => {
    e.stopPropagation()
    if (used) return
    used = true
    const dir = Math.sign(bossCX() - (x + 60)) || 1
    // carry it well past him and out of the aisle instead of deleting it mid-shot
    p.style.setProperty('--cx', (dir * (Math.abs(bossCX() - x) + AR.w * .7)).toFixed(0) + 'px')
    p.classList.add('roll')
    Sound.play('thud', 1.2)
    setTimeout(() => {
      if (!G.over && bossEl) {
        G.vx += dir * 780; G.vy -= 340
        whip(-dir, 1000); Sound.play('crack', .85)
        bits(bossCX(), bossCY(), 14, '#ff9f43')
        propHit('RUN OVER!', '#ff9f43cc', { text: '#ffd06a', shake: 'l', stop: .11, say: 'AAGH!' })
      }
      setTimeout(() => p.remove(), 900)      // after it has rolled off, not on impact
    }, 460)
  })
  $('#props').appendChild(p)
  setTimeout(() => { if (p.isConnected && !used) p.remove() }, 24000)
}
function spawnScreen() {
  const p = makeProp('screen', '<i style="height:30%"></i><i style="height:62%"></i><i style="height:44%"></i><i style="height:78%"></i>')

function spawnShelfProp(kind) {

function burstRain(cloud) {
  if (cloud.classList.contains('dark')) return
  cloud.classList.add('dark')
  Sound.play('rain')
  const fall = (AR.ground - parseFloat(cloud.style.top) - 46).toFixed(0) + 'px'
  for (let i = 0; i < 16; i++) {
    const d = el('i', 'drop')
    d.style.left = (8 + (i % 8) * 11).toFixed(0) + 'px'
    d.style.setProperty('--fall', fall)
    d.style.animationDelay = (i * 52 + rnd(0, 90)).toFixed(0) + 'ms'
    cloud.appendChild(d)
  }
  // soak him only while he is actually standing in it
  let ticks = 0
  const check = setInterval(() => {
    if (G.over || !cloud.isConnected) return stop()
    const cx = cloud.getBoundingClientRect().left - AR.left + 48
    if (Math.abs(cx - bossCX()) < 95) {
      if (!bossEl.classList.contains('wet')) {
        propHit('SOAKED!', '#3f7fd6cc', { text: '#7fc4ff', shake: 'm', say: 'Cold!' })
      }
      bossEl.classList.add('wet')
      if (ticks % 3 === 0) puddle(bossCX() + rnd(-40, 40))
    }
    if (++ticks > 16) stop()
  }, 260)
  function stop() {
    clearInterval(check)
    cloud.querySelectorAll('.drop').forEach(d => d.remove())
    setTimeout(() => bossEl && bossEl.classList.remove('wet'), 1200)
  }
}
function puddle(x) {
  const m = $('#mess'), p = el('div', 'puddle')
  const w = rnd(40, 78)
  p.style.width = w.toFixed(0) + 'px'
  p.style.left = (clamp(x, 30, AR.w - 30) - w / 2).toFixed(0) + 'px'
  p.style.top = (AR.ground + rnd(0, 22)).toFixed(0) + 'px'
  m.appendChild(p)
  const all = m.querySelectorAll('.puddle')
  for (let i = 0; i < all.length - 8; i++) all[i].remove()
}

  p.style.left = x.toFixed(0) + 'px'

  p.style.animation = 'none'
  let used = false
  p.addEventListener('pointerdown', e => {

    used = true

      setTimeout(() => bossEl && bossEl.classList.remove('floured'), 5200)

    p.style.opacity = '.3'
    setTimeout(() => p.remove(), 900)
  })

/* ================= SIGNATURE REACTIONS =================
   Spec calls for one reaction per boss that is theirs alone. Instead of hand-drawn
   clips, each one is a short pose written in joint angles: override the rest angles
   the springs are pulling toward, let the ragdoll settle into it, then release. */
const SIGNATURE = {
  ghost:       { t:1.2, say:'Still here.',  stiff:2.8, pose:{ torso:0, head:0, armL:8, armR:-8 }, cls:'sig-ghost' },
  architect:   { t:1.3, say:'Expensive.',   pose:{ head:-14, armR:28, foreR:-112 }, cls:'sig-think' },
  speedrunner: { t:.5,  say:'Too slow.',    kick:-140, cls:'sig-dash' },
  memelord:    { t:.9,  say:'Wow.',         hop:520, spin:380, cls:'sig-pop' },
  showman:     { t:1.0, say:'MY FACE!',     hop:780, spin:940, cls:'sig-fly' },
  algorithm:   { t:1.1, say:'Steady.',      pose:{ armL:76, armR:-76, foreL:40, foreR:-40, head:6 }, cls:'sig-shrug' },
  altruist:    { t:1.1, say:'Oops.',        pose:{ armL:92, armR:-92, foreL:30, foreR:-30, head:10 }, cls:'sig-panic' },
  rug:         { t:1.1, say:'MY BAG!',      pose:{ armL:-46, armR:46, foreL:70, foreR:-70 }, cls:'sig-hug' },
  chef:        { t:1.2, say:'Watch me.',    pose:{ armL:58, armR:-24, foreL:34, foreR:-96, head:-8 }, cls:'sig-chef' },
  hype:        { t:1.0, say:'WOOOO!',       pose:{ armL:104, armR:-104, foreL:40, foreR:-40, head:-12 }, hop:420, cls:'sig-hype' },
}
function restorePose() {
  const slack = G.over ? .18 : 1, sd = G.over ? .45 : 1
  for (const j of skel) {
    const b = BONES.find(x => x.n === j.n)
    j.rest = b.rest; j.k = b.k * slack; j.d = b.d * sd
  }
}
function signature(force) {
  if (G.over || !skel.length) return
  const now = performance.now()
  if (!force && now < G.sigAt) return
  G.sigAt = now + 2400
  const sg = SIGNATURE[G.boss.id]; if (!sg) return
  G.sigT = sg.t
  for (const j of skel) {
    if (sg.stiff) { j.k = j.base * sg.stiff; j.d = j.based * 1.7 }
    if (sg.pose && sg.pose[j.n] != null) j.rest = sg.pose[j.n]
  }
  if (sg.hop) G.vy -= sg.hop
  if (sg.spin) whip(Math.random() < .5 ? 1 : -1, sg.spin)
  if (sg.kick) G.vx += sg.kick
  if (sg.cls) { bossEl.classList.add(sg.cls); setTimeout(() => bossEl.classList.remove(sg.cls), sg.t * 1000) }
  if (sg.say) bubble(bossSig(G.boss))
}

/* ================= SKELETON RIG =================
   Bone list is shared by every boss; only lengths/widths differ per character.
   rest/min/max = joint constraints, k/d = spring-damper, sway = secondary-motion gain,
   hitW = how strongly a hit impulse whips that bone. */
const BONES = [
  { n:'torso', rest:0,   min:-46, max:46,  k:150, d:13,   sway:.5,  hitW:.75 },
  { n:'head',  rest:0,   min:-60, max:60,  k:205, d:11.5, sway:1.2, hitW:1.35 },
  { n:'armL',  rest:12,  min:-140,max:168, k:74,  d:6,    sway:2.3, hitW:2.1 },
  { n:'foreL', rest:8,   min:-45, max:168, k:92,  d:5.4,  sway:1.9, hitW:1.8 },
  { n:'armR',  rest:-12, min:-168,max:140, k:74,  d:6,    sway:2.3, hitW:2.1 },
  { n:'foreR', rest:-8,  min:-168,max:45,  k:92,  d:5.4,  sway:1.9, hitW:1.8 },
  { n:'legL',  rest:-3,  min:-58, max:58,  k:172, d:14,   sway:.75, hitW:.85 },
  { n:'shinL', rest:4,   min:-16, max:108, k:150, d:11.5, sway:.9,  hitW:.95 },
  { n:'legR',  rest:3,   min:-58, max:58,  k:172, d:14,   sway:.75, hitW:.85 },
  { n:'shinR', rest:-4,  min:-108,max:16,  k:150, d:11.5, sway:.9,  hitW:.95 },
]

function figure(b) {

  const f = el('div', 'boss' + (b.grin ? ' grin' : '') + (b.suit ? ' suit' : '') + (b.gaunt ? ' gaunt' : '') + (b.chub ? ' chub' : '') + (b.smirk ? ' smirk' : '') + (b.bare ? ' bare' : '') + (b.lips ? ' lips' : ''))
  const S = (k, v) => f.style.setProperty('--' + k, typeof v === 'number' ? v + 'px' : v)
  S('c', b.c); S('skin', d.skin); S('shirt', d.shirt); S('hair', d.hair); S('iris', d.iris)
  ;['hw','hh','hr','neckw','hairh','hairr','fringew','fringeh','eyey','eyex','eyew','eyeh','browlift','broww','browh',
    'nosey','nosew','noseh','mouthb','mouthw','mouthh','chinw',
    'tw','th','armw','uplen','forelen','legw','thighlen','shinlen','legspan'].forEach(k => S(k, d[k]))

         <div class="neck"></div>

         <div class="brow l"></div><div class="brow r"></div>
         <div class="nose"></div>
         <div class="mouth"><div class="teeth"></div></div>
         ${b.beard ? '<div class="stache"></div>' : ''}
         ${b.afro ? '<div class="afro"><i></i><i></i><i></i><i></i><i></i></div>' : '<div class="hair"></div>'}
         ${d.fringew !== '0px' && !b.afro ? '<div class="fringe"></div>' : ''}
         ${b.glasses ? '<div class="glasses"><i></i><i></i></div>' : ''}
         ${b.headset ? '<div class="headset"></div>' : ''}
         ${b.crown ? '<div class="crown"><i></i><i></i><i></i><b></b><s></s></div>' : ''}
         ${b.toque ? '<div class="toque"><i></i><i></i><i></i><b></b></div>' : ''}
       </div>`

  f.innerHTML = `<div class="shadow"></div>
    <div class="bn hip" data-b="hip">
      <div class="bn torso" data-b="torso">
        <div class="body"></div>
        <div class="shirt"><div class="shine"></div><div class="logo">${b.logo || ''}</div><div class="hem"></div></div>
        <div class="collar"></div>
        <div class="bn arm l" data-b="armL"><div class="sleeve"></div><div class="bn fore" data-b="foreL"><div class="hand"></div></div></div>
        <div class="bn arm r" data-b="armR"><div class="sleeve"></div><div class="bn fore" data-b="foreR"><div class="hand"></div>${b.id === 'rug' ? '<div class="bag">💰</div>' : ''}${b.mic ? '<div class="mic"></div>' : ''}</div></div>
        ${head}
      </div>
      <div class="bn leg l" data-b="legL"><div class="bn shin" data-b="shinL"></div></div>
      <div class="bn leg r" data-b="legR"><div class="bn shin" data-b="shinR"></div></div>
      <div class="stars">💫✨💫</div>
      <div class="sweat">💦</div>
      <div class="marks"></div>
    </div>`
  f.dataset.d = '0'
  return f
}
// build the live joint set bound to one figure's DOM
function makeSkeleton(fig) {
  return BONES.map(b => {
    const node = fig.querySelector('[data-b="' + b.n + '"]')
    return Object.assign({}, b, { el: node, a: b.rest, v: 0, base: b.k, based: b.d })
  })
}

function buildRoom(root, th) {
  root.className = 'room ' + th.kind
  if (th.kind === 'grocery') return buildGrocery(root, th)
  if (th.kind === 'floor') return buildFloor(root, th)
  if (th.kind === 'kitchen') return buildKitchen(root, th)
  root.innerHTML = `<div class="rays"></div><div class="sun">${th.sun}</div>
    <div class="skyline"></div><div class="floor"></div><div class="mat"></div>
    <div class="banner">${th.banner}</div>`
  const sky = root.querySelector('.skyline')
  ;[46, 72, 34, 88, 58, 96, 40, 78, 30, 66, 84, 50].forEach((h, i) => {
    const c = el('i'); if (i % 3 === 1) c.className = 'd'; c.style.height = h + '%'; sky.appendChild(c)
  })
  ;[[0, 12, 26], [1, 28, 34], [2, 8, 44]].forEach(([i, top, dur]) => {
    const c = el('div', 'cloud', artEl('cloud', { h: 52 })); c.style.top = top + '%'
    c.style.animationDuration = dur + 's'; c.style.animationDelay = (-i * 9) + 's'; root.appendChild(c)
  })
  ;['coin2', 'gem', 'rocket', 'coin2', 'chart'].forEach((e, i) => {
    const f = el('div', 'floaty', artEl(e, { h: 30 }))
    f.style.left = (8 + i * 20) + '%'; f.style.bottom = '18%'
    f.style.animationDuration = (9 + i * 2.5) + 's'; f.style.animationDelay = (-i * 3) + 's'
    root.appendChild(f)
  })
}

function buildFloor(root, th) {
  const bars = n => Array.from({ length: n }, (_, i) =>
    `<i class="${(i * 7) % 3 === 0 ? 'd' : ''}" style="height:${18 + (i * 23) % 70}%"></i>`).join('')
  root.innerHTML = `
    <div class="wall">${Array.from({ length: 8 }, () => `<div class="scr">${bars(9)}</div>`).join('')}</div>
    <div class="tape"><span>${th.banner} · ${th.banner} · ${th.banner} · ${th.banner}</span></div>
    <div class="desk"></div><div class="rug2"></div>`
}
function buildGrocery(root, th) {
  // eight sparse items read as a corner shop; packing the shelf reads as a supermarket
  const stock = ['chips','milk','bread','fishcan','grapepack','juice',
                 'cereal','eggs','soda','jam','noodle','choco']
  const shelf = (top, seed) => `<div class="shelf" style="top:${top}%">` +
    Array.from({ length: 12 }, (_, i) => {
      const k = stock[(i * 5 + seed) % stock.length]
      return `<i>${artEl(k, { h: 34 + ((i * 7 + seed) % 14), tilt: ((i * 31 + seed) % 7) - 3 })}</i>`
    }).join('') + '</div>'
  root.innerHTML = `
    <div class="ceil"><i></i><i></i><i></i><i></i></div>
    ${shelf(14, 0)}${shelf(33, 5)}
    <div class="sign">${th.banner}</div>
    <div class="fixtures">
      <span class="fx-till">${artEl('till', { h: 100 })}</span>
    </div>
    <div class="floor2"></div>`
}

// cached geometry — never read layout inside the frame loop
const AR = { w: 360, h: 520, left: 0, top: 0, ground: 0 }
function measure() {
  const a = $('#arena'); if (!a) return
  const r = a.getBoundingClientRect()
  AR.w = r.width; AR.h = r.height; AR.left = r.left; AR.top = r.top

addEventListener('resize', measure)
const lim = () => Math.max(20, (AR.w - 190) / 2)
const bossCX = () => AR.w / 2 + G.x
const BODY_H = 330

/* ================= START ================= */
function start(id) {
  Sound.boot()
  const b = (typeof id === 'string' ? BOSSES.find(x => x.id === id) : BOSSES[id]) || BOSSES[0]
  const cd = {}; WEAPONS.forEach(w => cd[w.id] = 0)
  Object.assign(G, {
    boss: b, max: b.hp, hp: b.hp, over: false, cd,
    hodl: false, hodlT: 4, gas: 0, gasMax: false,
    combo: 0, comboTier: 0, reboot: 0, rebootShown: false, talkIn: 5,
    shield: 0, shieldUsed: false, marks: {}, nMarks: 0,
    peg: 1, spiral: false, books: false, exit: 0, exitPrep: false,
    downline: [], hype: 0, hyped: false, lastHit: 0,
    sigT: 0, sigAt: 0, purse: 0, lock: 0, cine: false,
    drag: { on:false, id:-1, tx:0, ty:0, vx:0, vy:0, ox:0, oy:0 },
    x: 0, y: 0, vx: 0, vy: 0, prevVx: 0,
    tx: 0, moveT: 1.2, flee: 0, hitstop: 0, step: 0, bob: 0, talkAt: 0,
    walk: b.id === 'speedrunner' ? 235 : 86,
  })
  $('#select').hidden = true; $('#game').hidden = false
  $('#game').style.setProperty('--c', b.c)
  $('#bname').textContent = bossName(b); $('#bcoin').textContent = b.coin; $('#bmech').textContent = b.mech
  $('#callout').classList.remove('on')
  setTimeout(() => { if (!$('#game').hidden && G.boss === b) mechanic(b.mech, b.intro, bossIntro(b)) }, 420)
  $('#rekt').classList.remove('on')
  $('#gas').hidden = b.id !== 'architect'
  $('#peg').hidden = b.id !== 'algorithm'
  $('#hype').hidden = b.id !== 'hype'
  $('#hype').classList.remove('max')
  if (b.id === 'hype') { G.lastHit = performance.now(); paintHype() }
  $('#peg').classList.remove('broke'); $('#hpbar').classList.remove('books')
  if (b.id === 'algorithm') paintPeg()
  $('#gas').classList.remove('max'); $('#gas .bar i').style.width = '0%'
  $('#combo').classList.remove('on')
  paintPurse()
  $('#fx').innerHTML = ''
  $('#mess').innerHTML = ''; clearTimeout(sweepTimer); sweepTimer = 0
  clearProps(); scheduleProp()
  setTimeout(() => { if (!$('#game').hidden && G.boss === b) spawnProp() }, 6000)
  cinema(false, false)
  clearCoins()
  document.querySelectorAll('.coin,#shieldfx').forEach(n => n.remove())

  const st = $('#stage'); st.innerHTML = ''
  puppet = el('div', 'puppet')
  bossEl = figure(b)
  bossEl.addEventListener('pointerdown', e => {
    e.stopPropagation()
    attack(e)                                   // grabbing still lands a hit: no wasted taps
    if (G.over || G.cine) return
    Object.assign(G.drag, { on:true, id:e.pointerId, tx:G.x, ty:G.y, vx:0, vy:0,
      ox: (e.clientX - AR.left) - bossCX(), oy: (e.clientY - AR.top) - bossCY() })
    try { bossEl.setPointerCapture(e.pointerId) } catch (_) {}   // keep tracking outside the body
    bossEl.classList.add('held')
  })
  bossEl.addEventListener('pointermove', e => {
    moveAim(e.clientX, e.clientY)
    if (!G.drag.on || e.pointerId !== G.drag.id) return
    G.drag.tx = (e.clientX - AR.left) - G.drag.ox - AR.w / 2
    G.drag.ty = (e.clientY - AR.top) - G.drag.oy - AR.ground + BODY_H / 2
  })
  const letGo = e => {
    if (!G.drag.on || (e && e.pointerId !== G.drag.id)) return
    G.drag.on = false
    bossEl.classList.remove('held')
    G.vx = clamp(G.drag.vx * THROW_GAIN, -THROW_MAX, THROW_MAX)
    G.vy = clamp(G.drag.vy * THROW_GAIN, -THROW_MAX, THROW_MAX)
    const speed = Math.hypot(G.vx, G.vy)
    if (speed > 260) {                           // a real throw, not a set-down
      whip(Math.sign(G.vx) || 1, Math.min(1100, speed * .5))
      G.flee = 0                                 // he is busy being airborne
      if (speed > 1400) { Sound.play('whale', 1.4); shake('m') } else Sound.play('hit', .7)
    }
  }
  bossEl.addEventListener('pointerup', letGo)
  bossEl.addEventListener('pointercancel', letGo)
  puppet.appendChild(bossEl); st.appendChild(puppet)
  skel = makeSkeleton(bossEl)
  measure(); placeFixtures()          // needs AR.ground, so only after measure()
  paintHp(); render(); buildAim(); $('#aim').classList.remove('on')
  last = performance.now(); acc = 0
  requestAnimationFrame(loop)
}

/* ================= RAGDOLL ================= */
function whip(side, power) {
  for (const j of skel) j.v += -side * power * j.hitW * rnd(.75, 1.25)
}

/* ================= ATTACK ================= */
function attack(e) {
  if (G.over || G.cine) return
  const w = W(G.weapon), now = performance.now()
  // per-weapon cooldown AND a shared swing lock: without the lock a player can fire
  // every weapon in parallel and stack their cooldowns into ~2x the intended damage
  if (now < G.cd[w.id] || now < G.lock) return
  G.cd[w.id] = now + w.cd
  G.lock = now + Math.min(w.cd, SWING_LOCK)

  const x = e.clientX - AR.left, y = e.clientY - AR.top
  const b = G.boss
  if (b.id === 'architect') { G.gas = clamp(G.gas + 9, 0, 100); paintGas() }
  G.combo++; paintCombo()
  if (b.id === 'speedrunner' && !G.rebootShown && Math.random() < .04) reboot()

  G.lastHit = now
  if (b.id === 'hype') { G.hype = clamp(G.hype - 16, 0, 100); paintHype() }
  const crit = Math.random() < 1 / 12
  const dmg = calcDamage(w.dmg, { hodl: G.hodl, gasMax: G.gasMax, reboot: G.reboot > 0, crit,
    hyped: G.hyped, pegged: G.peg > .5 && b.id === 'algorithm' })
  if (b.id === 'algorithm') { G.peg = clamp(G.peg - w.dmg * .0028, 0, 1); paintPeg() }
  if (G.downline.length) {                        // the pyramid soaks it first
    hitDownline(dmg)
    spark(x, y, w.spark); dmgNum(x, y, dmg, 'blk'); Sound.play(w.sfx); shake('s')
    strikeAim(!!w.splat); goldDrop(x, y, 1, 1)
    return
  }
  const res = applyDamage(G.hp, G.shield, dmg)
  G.shield = res.shield; G.hp = res.hp

  if (w.swing) at(el('div', 'swing', w.swing), x, y)
  if (w.drop) at(el('div', 'drop', w.drop), x, y)
  if (w.fly) at(el('div', 'fly', w.fly), x, y)
  if (w.splat) { at(el('div', 'splat'), x, y); at(pizzaNode('thrown'), x, y); pizzaMess(e.clientX, e.clientY) }
  spark(x, y, w.spark)

  if (res.absorbed) {
    dmgNum(x, y, t('blocked'), 'blk'); Sound.play('block'); shake('s'); bits(x, y, 5, '#ff8e8e')
    if (G.shield <= 0) breakShield()
    return
  }

  const side = Math.sign((x - bossCX()) || 1)      // struck from the right -> flies left
  const imp = impulse(w.kick, w.lift, side)
  G.vx += imp.vx; G.vy += imp.vy
  whip(side, w.kick * .8)
  G.hitstop = w.hit === 'light' ? .015 : .075
  G.flee = w.hit === 'light' ? (Math.random() < .3 ? .8 : 0) : rnd(1.1, 1.9)

  strikeAim(!!w.splat)
  ouch(); addMark(e.clientX, e.clientY, w.hit !== 'light')
  dmgNum(x, y, dmg, crit ? 'crit' : w.id === 'whale' ? 'big' : '')
  bits(x, y, w.hit === 'light' ? 4 : 10)
  /* Pay for damage, not for taps. Paying per hit meant candle spam out-earned real
     weapons six to one, so the economy was telling players not to buy the very thing
     the shop sells. Combo is a modest multiplier now, not the main income. */
  const tier = Math.min(5, Math.floor(G.combo / 5))
  const value = Math.max(1, Math.round(dmg / COIN_PER_DMG * (1 + tier * .1)))
  const objs = clamp(Math.round(value / 3), 1, 6)   // value and coin count are separate
  goldDrop(x, y, objs, Math.max(1, Math.round(value / objs)))
  if (tier > G.comboTier) {                        // newly reached 5/10/15/20/25
    G.comboTier = tier
    goldDrop(bossCX(), bossCY(), 5, 3)
    banner('COMBO x' + G.combo + '   x' + (1 + tier * .1).toFixed(1), '#ffe066')
    Sound.play('coins')
  }
  // combo raises the pitch of every hit — cheapest escalation there is
  Sound.play(w.sfx, 1 + Math.min(G.combo, 22) * .028)
  if (crit) {
    at(el('div', 'critlabel', 'CRITICAL!'), x, y - 40)
    G.hitstop = Math.max(G.hitstop, .13); flash(); shake('l')
    G.vx *= 1.5; G.vy *= 1.4; whip(side, 700)
    Sound.play('crack', 1.5)
  }

  if (w.hit === 'light') shake('s')
  else if (w.hit === 'mid') { shake('m'); banner(w.shout, '#ffe066') }
  else { shake('l'); flash(); banner(w.shout, w.hit === 'launch' ? '#7ef29a' : '#ffe066')
    Sound.play('scream', clamp(b.voice / 190, .55, 1.9)) }
  // he speaks once every few hits, never twice on top of itself
  if (--G.talkIn <= 0) { G.talkIn = Math.round(rnd(4, 6)); talk(true, Math.random() < .4 ? painWord() : null) }
  if (w.id === 'whale') pop(el('div', 'whalefly', '🐋'))

  const heavyish = w.hit === 'heavy' || w.hit === 'launch'
  if (heavyish || crit || (w.hit === 'mid' && Math.random() < .35)) setTimeout(() => signature(), 280)

  paintHp(); paintDamageStage(); checkThresholds()
  if (G.hp <= 0) die()
}

/* INFINITE SUPPLY — Dogecoin never stops printing.

const MINT_MS = 3400, MINT_HEAL = 55
function clearCoins() {

}
function mintCoins() {

/* DEATH SPIRAL — while the peg holds he soaks damage. Break it and he bleeds out

/* PYRAMID — her downline lines up in front and eats the damage meant for her.

function spawnDownline() {

function hitDownline(dmg) {

function paintCombo() {
  const c = $('#combo')
  c.classList.toggle('on', G.combo >= 3)
  if (G.combo >= 3) c.textContent = t('combo') + G.combo
}
function paintHp() {
  const p = G.hp / G.max
  $('#hpfill').style.width = (p * 100) + '%'
  const bar = $('#hpbar')
  bar.classList.toggle('mid', p <= .5 && p > .2)
  bar.classList.toggle('low', p <= .2)
}
function checkThresholds() {
  const p = G.hp / G.max
  if (p <= .5 && !G.marks.p50) { G.marks.p50 = 1; banner('SELL PRESSURE', '#ffe066') }
  if (p <= .2 && !G.marks.p20) { G.marks.p20 = 1; banner('LIQUIDATION WARNING', '#ff3b4e') }
  if (G.boss.id === 'showman' && p <= .6 && !G.shieldUsed) {
    G.shieldUsed = true; G.shield = G.shieldMax
    const s = el('div', '', '<b>ENERGY SHIELD</b>'); s.id = 'shieldfx'; $('#arena').appendChild(s)
    banner('ENERGY SHIELD', '#ff3b4e'); talk(true)
    mechanic('ENERGY SHIELD', 'A shield is soaking every hit. Break it before you can reach him.')
  }
  if (G.boss.id === 'rug' && p <= .4 && !G.marks.exit && G.exit <= 0) { G.marks.exit = 1; startExit() }
  if (G.boss.id === 'chef' && !G.downline.length) {
    if (p <= .75 && !G.marks.d1) { G.marks.d1 = 1; spawnDownline() }
    if (p <= .4 && !G.marks.d2) { G.marks.d2 = 1; spawnDownline() }
  }
  if (G.boss.id === 'memelord' && !G.coins.length) {
    if (p <= .75 && !G.marks.s1) { G.marks.s1 = 1; mintCoins() }
    if (p <= .45 && !G.marks.s2) { G.marks.s2 = 1; mintCoins() }
    if (p <= .2 && !G.marks.s3) { G.marks.s3 = 1; mintCoins() }
  }
}
function die() {
  // BALANCE SHEET — the bar you were emptying was never the real one
  if (G.boss.id === 'altruist' && !G.books) {
    G.books = true
    G.hp = 0; paintHp(); paintDamageStage()      // he reads as finished: stars, dizzy eyes
    Sound.play('ko'); shake('l'); flash()
    whip(Math.random() < .5 ? 1 : -1, 900)       // sags like the fight is over
    cutscene('BALANCE SHEET',
      'That bar was fake. This purple one is real.',
      '아까 그 체력바는 가짜였다. 이 보라색이 진짜다.',
      2500)
    setTimeout(() => {                           // the reveal, mid-scene
      if (G.over || !G.boss || G.boss.id !== 'altruist') return
      $('#hpbar').classList.add('books')
      G.hp = Math.round(G.max * .45)
      paintHp(); paintDamageStage()
      banner('OFF THE BOOKS', '#c9a4ff'); Sound.play('shield'); flash(); shake('m')
      signature(1)
    }, 1400)
    return
  }
  G.over = true
  // A finished run, reported to the platform — the server decides the points.
  { const ta = TA(); if (ta) ta.track('session_complete') }
  clearCoins()
  G.downline.forEach(f => f.node.remove()); G.downline = []
  const s = $('#shieldfx'); if (s) s.remove()
  bossEl.dataset.d = '4'
  G.vy -= 900; G.vx += rnd(-260, 260)
  limp(); whip(Math.random() < .5 ? 1 : -1, 1600)
  shake('l'); flash(); Sound.play('ko')
  Sound.play('scream', clamp(G.boss.voice / 210, .5, 1.8)); bubble('REKT!')
  setTimeout(() => $('#rekt').classList.add('on'), 950)
}

/* ================= SIMULATION =================
   Fixed 120Hz steps with an accumulator: springs stay stable and motion
   does not stutter when a frame runs long. Rendering happens once per frame. */
const DT = 1 / 120
function physics(dt) {
  if (G.hitstop > 0) { G.hitstop -= dt; return }

  G.prevVx = G.vx
  const held = G.drag.on
  if (held) {
    // follow the pointer, and derive velocity from that motion so the throw on release
    // is whatever the hand was doing — smoothed, or one jittery frame decides the throw
    const L0 = lim()
    const nx = clamp(G.drag.tx, -L0, L0), ny = clamp(G.drag.ty, ceilY(), 0)
    G.drag.vx += ((nx - G.x) / dt - G.drag.vx) * .3
    G.drag.vy += ((ny - G.y) / dt - G.drag.vy) * .3
    G.vx = G.drag.vx; G.vy = G.drag.vy
    G.x = nx; G.y = ny
  } else {
    G.vy += 2600 * dt
    G.x += G.vx * dt
    G.y += G.vy * dt
  }

  // ceiling: keep his head inside the arena so a big throw never parks him off screen
  const CY = ceilY()
  if (G.y < CY) { G.y = CY; if (G.vy < 0) { G.vy = -G.vy * .35; whip(Math.sign(G.vx) || 1, 300) } }

  const airborne = held || G.y < -1
  if (held) { /* the hand holds him up */ }
  else if (airborne) G.vx *= Math.pow(.35, dt)
  else {
    G.y = 0
    if (G.vy > 320) {
      G.vy = -G.vy * .34; G.vx *= .6
      whip(Math.sign(G.vx) || 1, 260)
      dust(bossCX(), AR.ground + 6); Sound.play('thud'); shake('s')
    } else G.vy = 0
    G.vx *= Math.pow(.015, dt)
  }

  const L = lim()
  if (!held) {
    if (G.x > L) { G.x = L; G.vx = -Math.abs(G.vx) * .5; whip(1, 420) }
    if (G.x < -L) { G.x = -L; G.vx = Math.abs(G.vx) * .5; whip(-1, 420) }
  }

  // grounded locomotion — flee after a hit, otherwise wander, so aiming matters
  if (G.sigT > 0) { G.sigT -= dt; if (G.sigT <= 0) restorePose() }
  const settled = !airborne && Math.abs(G.vx) < 70
  if (!G.over && settled && !G.exitPrep && !held) {
    if (G.exit > 0) {                              // sprinting for the edge with the bag
      G.exit -= dt
      const dir = G.x >= 0 ? 1 : -1
      G.x += dir * 120 * dt          // 430 crossed the arena in 0.38s: invisible and unreactable
      G.step += dt * 18
      if (Math.abs(G.x) >= L - 3) rugEscaped()
      else if (G.exit <= 0) rugCaught()
    } else if (G.flee > 0) {
      G.flee -= dt
      bossEl.classList.add('scared')
      if (Math.abs(G.tx - G.x) < 30) G.tx = (G.x > 0 ? -1 : 1) * rnd(L * .4, L)
      G.x += Math.sign(G.tx - G.x) * G.walk * 2.6 * dt
      G.step += dt * 16
    } else {
      bossEl.classList.remove('scared')
      G.moveT -= dt
      if (Math.abs(G.tx - G.x) > 10) { G.x += Math.sign(G.tx - G.x) * G.walk * dt; G.step += dt * 7 }
      else if (G.moveT <= 0) { G.tx = rnd(-L, L); G.moveT = rnd(1.4, 3.2) }
    }
    G.x = clamp(G.x, -L, L)
    G.bob = -Math.abs(Math.sin(G.step)) * 5     // visual only — never touches physics y
  } else G.bob += (0 - G.bob) * Math.min(1, 10 * dt)

  // secondary motion: limbs lag behind the body's acceleration
  const ax = (G.vx - G.prevVx) / dt
  for (const j of skel) {
    j.v -= ax * j.sway * dt * .06
    if (airborne) j.v += (j.n.startsWith('arm') || j.n.startsWith('fore') ? -8 : 4) * dt
    stepJoint(j, dt)
  }
}
function render() {
  puppet.style.transform = `translate3d(${(G.x).toFixed(2)}px,${(G.y + G.bob).toFixed(2)}px,0)`
  for (const j of skel) j.el.style.transform = `rotate(${j.a.toFixed(2)}deg)`
  const air = clamp(-G.y / 260, 0, 1)
  const sh = bossEl.querySelector('.shadow')
  sh.style.transform = `scale(${(1 - air * .55).toFixed(3)})`
  sh.style.opacity = (1 - air * .6).toFixed(2)
  const s = $('#shieldfx')
  if (s) s.style.transform = `translate3d(${bossCX().toFixed(1)}px,${(bossCY() + 10).toFixed(1)}px,0)`
}
function loop(t) {
  if ($('#game').hidden) return
  let dt = (t - last) / 1000; last = t
  if (dt > .25) dt = .25                       // tab was backgrounded: don't explode
  acc += dt
  let steps = 0
  while (acc >= DT && steps < 8) { physics(DT); acc -= DT; steps++ }
  if (steps === 8) acc = 0

  if (!G.over) {
    const b = G.boss
    if (b.id === 'ghost') {
      G.hodlT -= dt
      if (G.hodlT <= 0) {
        G.hodl = !G.hodl; G.hodlT = G.hodl ? 3 : 6.5
        if (G.hodl) { banner('HODL!', '#f7931a'); talk(true); bossEl.style.filter = 'saturate(.55) brightness(.9)'
          mechanic('HODL MODE', 'He is guarding — your damage is halved until he drops it.'); signature(1) }
        else bossEl.style.filter = ''
      }
    }
    if (b.id === 'hype') {
      const idle = (performance.now() - G.lastHit) / 1000
      if (idle > .5) { G.hype = clamp(G.hype + 26 * dt, 0, 100); paintHype() }
    }
    if (b.id === 'architect' && G.gas > 0) { G.gas = clamp(G.gas - 26 * dt, 0, 100); paintGas() }
    if (b.id === 'algorithm') {
      if (G.spiral) {                                  // bleeding out, but clawing the peg back up
        G.hp = Math.max(0, G.hp - 26 * dt)
        G.peg = clamp(G.peg + .055 * dt, 0, 1)
        paintHp(); paintDamageStage(); paintPeg()
        if (G.hp <= 0) die()
      } else if (G.peg < 1) { G.peg = clamp(G.peg + .02 * dt, 0, 1); paintPeg() }
    }
    if (b.id === 'speedrunner') {
      if (G.reboot > 0) {
        G.reboot -= dt; G.walk = 0; bossEl.style.filter = 'brightness(1.4) saturate(.4)'
        if (G.reboot <= 0) { G.walk = 235; bossEl.style.filter = '' }
      }
    }
  }
  render()
  requestAnimationFrame(loop)
}

setInterval(() => {
  if ($('#game').hidden) return
  const now = performance.now()
  document.querySelectorAll('.wp').forEach(b => {
    const w = W(b.dataset.w)
    b.querySelector('.cd').style.transform = 'scaleY(' + clamp((G.cd[w.id] - now) / w.cd, 0, 1) + ')'
  })
  // the shared swing lock dims the whole bar instead of sweeping six gauges at once
  $('#weapons').classList.toggle('locked', now < G.lock)
}, 60)

/* ---- boot ---- */
applyTheme(Save.stage)   // must follow AR: it calls measure()
$('#lang').onclick = toggleLang
$('#lang2').onclick = toggleLang
$('#shopbtn').onclick = () => { Sound.boot(); buildShop(); $('#shop').classList.add('on') }
$('#shopclose').onclick = () => $('#shop').classList.remove('on')
$('#shop').onclick = e => { if (e.target.id === 'shop') $('#shop').classList.remove('on') }
applyLang()          // builds the roster and the weapon bar in the current language
paintSound()

/* ================= self-check: index.html#test ================= */
function selfTest() {
  const a = (c, m) => { if (!c) throw new Error('FAIL ' + m) }
  a(calcDamage(22, {}) === 22, 'base')
  a(calcDamage(22, { hodl: 1 }) === 11, 'hodl halves')
  a(calcDamage(20, { gasMax: 1 }) === 14, 'gas -30%')
  a(calcDamage(6, { hodl: 1, gasMax: 1 }) === 2, 'stacked')
  a(calcDamage(1, { hodl: 1 }) === 1, 'min 1')
  a(calcDamage(6, { reboot: 1 }) === 12, 'reboot doubles')
  a(calcDamage(20, { pegged: 1 }) === 12, 'holding peg soaks 40%')
  a(calcDamage(6, { crit: 1 }) === 18, 'crit triples')
  a(calcDamage(20, { crit: 1, pegged: 1 }) === 36, 'crit still soaked by the peg')
  let r = applyDamage(500, 180, 200); a(r.absorbed && r.shield === 0 && r.hp === 500, 'shield absorbs, no bleed-through')
  r = applyDamage(500, 0, 200); a(!r.absorbed && r.hp === 300, 'hp damage')
  r = applyDamage(50, 0, 200); a(r.hp === 0, 'hp floors at 0')
  a(damageStage(1000, 1000) === 0 && damageStage(700, 1000) === 1, 'stage early')
  a(damageStage(500, 1000) === 2 && damageStage(200, 1000) === 3 && damageStage(50, 1000) === 4, 'stage late')
  let k = impulse(500, 600, 1); a(k.vx === -500 && k.vy === -600, 'struck on the right -> flies left and up')
  k = impulse(500, 600, -1); a(k.vx === 500, 'struck on the left -> flies right')
  // joint: overshoot is clamped, and a released spring converges back to rest
  let j = { a: 0, v: 20000, rest: 0, k: 200, d: 12, min: -40, max: 40 }
  stepJoint(j, 1 / 120)
  a(j.a <= 40 && j.a >= -40, 'joint constraint holds')
  a(j.v < 0, 'clamped joint bounces back')
  j = { a: 30, v: 0, rest: 0, k: 200, d: 40, min: -90, max: 90 }
  for (let i = 0; i < 600; i++) stepJoint(j, 1 / 120)
  a(Math.abs(j.a) < 1, 'spring-damper settles to rest')
  a(BONES.length === 10 && BONES.every(b => b.min < b.max), 'rig sane')

  // voice picking, against a realistic desktop voice list (headless exposes none)
  if (typeof Voice !== 'undefined') {
    const mk = (name, lg, local) => ({ name, lang: lg, localService: local })
    const V = Object.create(Voice)
    V.list = [
      mk('Albert', 'en-US', true), mk('Bad News', 'en-US', true), mk('Bells', 'en-US', true),
      mk('Alex', 'en-US', true), mk('Samantha', 'en-US', true), mk('Daniel', 'en-GB', true),
      mk('Karen', 'en-AU', true), mk('Google US English', 'en-US', false),
      mk('Yuna', 'ko-KR', true), mk('Google 한국의', 'ko-KR', false),
    ]
    const en0 = V.pickVoice('en', 0), en1 = V.pickVoice('en', 1)
    a(en0 && en1, 'english resolves to a voice')
    a(!/albert|bad news|bells/i.test(en0.name + en1.name), 'novelty voices are skipped')
    a(en0.localService && en1.localService, 'offline-capable voices win over network ones')
    a(en0.name !== en1.name, 'different bosses get different voices')
    a(V.pickVoice('ko', 0).name === 'Yuna', 'korean picks the local voice, not the network one')
    a(V.pickVoice('ko', 5).name === 'Yuna', 'index wraps when a language has one voice')
    a(V.pickVoice('ja', 0) === null, 'unknown language yields no voice, so blips take over')
  }
  console.log('%cREKT self-check ok', 'color:#12b47a')
}
if (location.hash === '#test') selfTest()

/* ================= TOKENAPPS HANDSHAKE =================
   Runs only when the platform SDK loaded (i.e. inside TokenApps or anywhere
   the script tag resolves). Adopts the account save when one exists so coins
   and unlocks follow the player across devices; otherwise pushes the local
   save up once. Everything is fire-and-forget — the game never waits on it. */
{
  const ta = TA()
  if (ta) {
    ta.on('session', () => {
      if (!ta.canSave()) return
      ta.load().then(raw => {
        if (raw && typeof raw === 'object' && ('coins' in raw)) {
          store.setItem('rekt.save', JSON.stringify(raw))
          Save.load()
          applyLang()            // rebuilds roster, weapons, stages, purse
        } else {
          Save.save()            // first sign-in: seed the account slot
        }
      }).catch(() => {})
    })
    ta.ready()
  }
}
</script>
